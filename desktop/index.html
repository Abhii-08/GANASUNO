<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GANASUNO Desktop Companion</title><style>
*{box-sizing:border-box}body{margin:0;background:#11131a;color:#eee;font:15px system-ui,sans-serif}header,footer{padding:18px 24px;background:#1c202a;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header strong{font-size:24px;letter-spacing:2px}header small{color:#a4aabd}main{display:grid;grid-template-columns:300px 1fr;min-height:65vh}aside{padding:20px;border-right:1px solid #333;overflow:auto;max-height:70vh}section{padding:26px;min-width:0}button,input,select{background:#282d39;color:#fff;border:1px solid #454c60;border-radius:8px;padding:10px}button{cursor:pointer}button:hover{background:#39435e}button:focus-visible{outline:2px solid #9faaff}button:disabled{opacity:.4}input[type=range]{padding:0;accent-color:#a5aaff}#queue{padding:0;list-style:none}#queue li{display:flex;gap:5px;align-items:center;margin:6px 0}#queue li button:first-child{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#queue li.active button:first-child{background:#555ab0}#title{font-size:clamp(22px,4vw,48px);overflow-wrap:anywhere}#art{height:180px;width:180px;border-radius:50%;margin:12px auto;background:repeating-radial-gradient(circle,#1b1f2c 0,#1b1f2c 7px,#303748 8px,#303748 9px);display:grid;place-items:center;font-size:55px;color:#c5c8ff;border:1px solid #545b70}#seek{width:100%}#status{min-height:22px;color:#bbc4d8}label{display:flex;align-items:center;gap:8px}body.mini main{grid-template-columns:1fr;min-height:0}body.mini #sidebarWrap,body.mini #art,body.mini #intro{display:none}body.mini section{padding:14px}body.mini #title{font-size:20px}body.mini footer{display:none}body.mini header{padding:10px;gap:6px}body.mini header strong{font-size:18px}body.mini #wave{height:48px!important}body.mini #status{margin:4px 0} @media(max-width:660px){main{grid-template-columns:1fr}aside{max-height:36vh;border-right:none;border-bottom:1px solid #333}section{padding:16px}}
</style></head><body><header><strong>GANASUNO</strong><small>Desktop • local audio</small><button id="mini">Mini view</button><button id="fullscreen">Fullscreen</button><button id="clear">Clear queue</button></header><main><div id="sidebarWrap" style="position:relative;min-width:0"><aside id="sidebar" style="padding-right:42px"><label>Choose audio files <input id="files" type="file" accept="audio/*,.mp3,.wav,.flac,.m4a,.ogg,.opus" multiple></label><input id="search" placeholder="Find in queue" style="width:100%;margin-top:12px"><ol id="queue"></ol><hr><h3>Saved playlists</h3><input id="playlistName" maxlength="80" placeholder="Playlist name" aria-label="Playlist name"><button id="savePlaylist">Save current queue</button><p id="libStatus" role="status"></p><div id="savedPlaylists"></div><h3>Browse saved audio</h3><select id="libGroup" aria-label="Library category"><option value="playlist">Playlists</option><option value="album">Albums</option><option value="artist">Artists</option><option value="podcast">Podcasts</option></select><input id="libFilter" placeholder="Filter groups" aria-label="Filter groups"><div id="savedGroups"></div></aside><input id="sidebarScroll" type="range" min="0" max="1000" value="0" aria-label="Drag to scroll library" style="position:absolute;right:6px;top:12px;height:calc(100% - 24px);width:22px;writing-mode:vertical-lr;direction:ltr"></div><section><p id="intro">Play music files you own. Files stay on this computer. No uploads or sign-in.</p><div id="art">♫</div><h1 id="title">Choose audio to begin</h1><canvas id="wave" width="900" height="90" style="width:100%;height:90px;cursor:pointer" aria-label="Audio waveform, click to seek"></canvas><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek"><div id="times">0:00 / 0:00</div><p id="status" role="status"></p><div><button id="prev">Previous</button> <button id="play">Play</button> <button id="next">Next</button></div></section></main><footer><label><input id="shuffle" type="checkbox">Shuffle</label><label>Repeat <select id="repeat"><option value="off">Off</option><option value="one">One</option><option value="all">All</option></select></label><label>Speed <select id="speed"><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select></label><label>Volume <input id="vol" type="range" min="0" max="1" step="0.01" value="0.85"></label><label>Crossfade <select id="fade"><option value="0">Off</option><option>3</option><option>5</option><option>8</option></select> seconds</label><label><input id="continuousAlbums" type="checkbox" checked>Keep albums continuous</label><label><input id="djSweep" type="checkbox">DJ filter sweep</label><label><input id="panOn" type="checkbox">8D stereo pan</label><label>Rotation <input id="period" type="range" min="3" max="30" value="8"><output id="periodText">8 s</output></label><label>Direction <select id="direction"><option value="1">Left first</option><option value="-1">Right first</option></select></label><label>Delay <select id="delay"><option value="off">Off</option><option value="slap">Slapback</option><option value="quarter">Quarter-style</option><option value="dub">Dub</option></select></label></footer><script src="album.js"></script><script src="player.js"></script><script src="effects.js"></script><script src="groups.js"></script><script src="library.js"></script><script src="batch10.js"></script><script src="window.js"></script></body></html>
