name: Build and publish signed APK
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Repository maintainer must review licensing and approve release distribution first.
    if: vars.RELEASE_APPROVED == 'true' && github.event.repository.private == false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Python tests
        run: |
          python -m unittest discover -s tests
          python -m unittest discover -s server
      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^[[:space:]]*versionName = "\([0-9.]*\)".*/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/^[[:space:]]*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)+$ && "$code" =~ ^[0-9]+$ && "v$version" == "$GITHUB_REF_NAME" ]]
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
      - name: Build release candidate
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFossRelease :app:lintFossRelease :app:testFossDebugUnitTest :app:verifyReleaseDependencies :app:generateDependencyInventory --stacktrace
          diff -u docs/licenses/release-license-inventory.txt release-license-inventory.txt
      - name: Package reviewed corresponding source
        run: python3 tools/package_release_source.py "$(git rev-parse HEAD)" "$VERSION_NAME"
      - name: Sign and verify APK
        shell: bash
        env:
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_B64" && test -n "$SIGNING_STORE_PASSWORD" && test -n "$SIGNING_KEY_ALIAS" && test -n "$SIGNING_KEY_PASSWORD"
          umask 077
          keyfile="$RUNNER_TEMP/ganasuno-signing.jks"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$keyfile"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          if [[ ! -x "$tools/apksigner" ]]; then sdkmanager "build-tools;36.0.0"; fi
          apk=app/build/outputs/apk/foss/release/app-foss-release-unsigned.apk
          test -f "$apk"
          "$tools/zipalign" -P 16 -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$keyfile" --ks-key-alias "$SIGNING_KEY_ALIAS" --ks-pass env:SIGNING_STORE_PASSWORD --key-pass env:SIGNING_KEY_PASSWORD --out GANASUNO.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs GANASUNO.apk | tee "$RUNNER_TEMP/certificate.txt"
          expected_cert=${RELEASE_CERT_SHA256,,}
          expected_cert=${expected_cert//:/}
          [[ "$expected_cert" =~ ^[a-f0-9]{64}$ ]] || { echo "::error::Expected a configured APK signer SHA-256 pin"; exit 1; }
          actual_cert=$(sed -En 's/^Signer #[0-9]+ certificate SHA-256 digest:[[:space:]]*([[:xdigit:]]+).*/\1/p' "$RUNNER_TEMP/certificate.txt")
          actual_cert=$(printf '%s' "$actual_cert" | tr '[:upper:]' '[:lower:]')
          [[ "$actual_cert" == "$expected_cert" ]] || { echo "::error::Signed APK certificate does not match the configured public pin"; exit 1; }
          "$tools/aapt" dump badging GANASUNO.apk > "$RUNNER_TEMP/badging.txt" || { echo "::error::Could not read signed APK metadata"; exit 1; }
          package=$(grep -m 1 '^package:' "$RUNNER_TEMP/badging.txt")
          printf '%s\n' "$package"
          [[ "$package" == *"name='com.abhi.ganasuno'"* && "$package" == *"versionCode='$VERSION_CODE'"* && "$package" == *"versionName='$VERSION_NAME'"* ]] || { echo "::error::APK package or version mismatch"; exit 1; }
          cp GANASUNO.apk "GANASUNO-v$VERSION_NAME-universal.apk"
          sha256sum GANASUNO.apk "GANASUNO-v$VERSION_NAME-universal.apk" "Corresponding-Source-v$VERSION_NAME.zip" > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            printf 'versionCode: %s\n\n' "$VERSION_CODE"
            cat "docs/releases/$GITHUB_REF_NAME.md"
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" GANASUNO.apk "GANASUNO-v$VERSION_NAME-universal.apk" SHA256SUMS.txt "Corresponding-Source-v$VERSION_NAME.zip" --verify-tag --title "GANASUNO $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
