name: Build and publish signed APK
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    # Repository maintainer must review licensing and approve release distribution first.
    if: vars.RELEASE_APPROVED == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^[[:space:]]*versionName = "\([0-9.]*\)".*/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/^[[:space:]]*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)+$ && "$code" =~ ^[0-9]+$ && "v$version" == "$GITHUB_REF_NAME" ]]
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
      - name: Build release candidate
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFossRelease --stacktrace
      - name: Sign and verify APK
        shell: bash
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_B64" && test -n "$SIGNING_STORE_PASSWORD" && test -n "$SIGNING_KEY_ALIAS" && test -n "$SIGNING_KEY_PASSWORD"
          umask 077
          keyfile="$RUNNER_TEMP/ganasuno-signing.jks"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$keyfile"
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          apk=app/build/outputs/apk/foss/release/app-foss-release-unsigned.apk
          test -f "$apk"
          "$tools/zipalign" -P 16 -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$keyfile" --ks-key-alias "$SIGNING_KEY_ALIAS" --ks-pass env:SIGNING_STORE_PASSWORD --key-pass env:SIGNING_KEY_PASSWORD --out GANASUNO.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose GANASUNO.apk
          sha256sum GANASUNO.apk > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf 'versionCode: %s\n\nSee CHANGELOG.md for release notes.\n' "$VERSION_CODE" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" GANASUNO.apk SHA256SUMS.txt --verify-tag --title "GANASUNO $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
