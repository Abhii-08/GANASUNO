name: GANASUNO Signing Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFossRelease :app:verifyReleaseDependencies --stacktrace

      - name: Sign and Verify APK
        shell: bash
        env:
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE="$RUNNER_TEMP/ganasuno.jks"
          trap 'rm -f "$KEYSTORE"' EXIT

          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"

          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          if [[ ! -x "$TOOLS/apksigner" ]]; then sdkmanager "build-tools;36.0.0"; fi

          "$TOOLS/zipalign" -P 16 -f 4 app/build/outputs/apk/foss/release/app-foss-release-unsigned.apk aligned.apk

          "$TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASSWORD \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --out GANASUNO.apk aligned.apk

          "$TOOLS/apksigner" verify --verbose --print-certs GANASUNO.apk | tee "$RUNNER_TEMP/certificate.txt"
          actual=$(sed -En 's/^Signer #[0-9]+ certificate SHA-256 digest:[[:space:]]*([[:xdigit:]]+).*/\1/p' "$RUNNER_TEMP/certificate.txt")
          actual=$(printf '%s' "$actual" | tr '[:upper:]' '[:lower:]')
          [[ "$actual" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "::error::Expected exactly one APK signer SHA-256 digest"; exit 1; }
          expected=${RELEASE_CERT_SHA256,,}
          expected=${expected//:/}
          if [[ -n "$expected" ]]; then
            [[ "$actual" == "$expected" ]] || { echo "::error::Signed APK certificate does not match the configured public pin"; exit 1; }
          fi
          version=$(sed -n 's/^[[:space:]]*versionName = "\([0-9.]*\)".*/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/^[[:space:]]*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)+$ && "$code" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Could not read the configured application version"; exit 1; }
          "$TOOLS/aapt" dump badging GANASUNO.apk > "$RUNNER_TEMP/badging.txt" || { echo "::error::Could not read signed APK metadata"; exit 1; }
          package=$(grep -m 1 '^package:' "$RUNNER_TEMP/badging.txt")
          printf '%s\n' "$package"
          [[ "$package" == *"name='com.abhi.ganasuno'"* && "$package" == *"versionCode='$code'"* && "$package" == *"versionName='$version'"* ]] || { echo "::error::APK package or version mismatch"; exit 1; }
          printf 'Public signer SHA-256: %s\n' "$actual"
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: GANASUNO-Signed-APK
          path: GANASUNO.apk
          if-no-files-found: error
