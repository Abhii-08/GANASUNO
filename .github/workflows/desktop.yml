name: Package native desktop preview
on:
  workflow_dispatch:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r desktop/requirements-native.txt pyinstaller
      - run: python -m unittest discover -s tests -p 'test_native*.py'
      - run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name GANASUNO desktop/native_player.py
      - uses: actions/upload-artifact@v4
        with:
          name: GANASUNO-native-${{ matrix.os }}
          path: dist/
